function vPerfil() {
  const p = S.perfil;
  if (!p || !p.onboard) return topo('Perfil', false) + `<main class="wrap fichas"><div class="vazio"><h2>Crie seu perfil</h2><p>Responda algumas perguntas sobre você e seus objetivos e o app monta uma ficha de treino sob medida.</p><button class="btn" data-a="pfRefazer">Começar</button></div></main>`;
  const imc = p.peso && p.altura ? (p.peso / ((p.altura / 100) ** 2)).toFixed(1).replace('.', ',') : '—';
  const sel = (k) => `<div class="field"><label for="pf-${k}">${{ sexo: 'Sexo', objetivo: 'Objetivo', nivel: 'Experiência', dias: 'Dias por semana', local: 'Local' }[k]}</label><select class="inp" id="pf-${k}" data-a="pfCampo" data-k="${k}">${PF[k].map(([v, n]) => `<option value="${v}" ${String(p[k]) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`;
  const num = (k, r, un) => `<div class="field"><label for="pf-${k}">${r} (${un})</label><input class="inp" id="pf-${k}" inputmode="decimal" data-a="pfCampo" data-k="${k}" value="${esc(p[k] ?? '')}"></div>`;
  const c = S.confirmar;
  return topo('Perfil', false) + `<main class="wrap perfil">
    <div class="pfhd"><span class="avatar">${esc((p.nome || '?').trim().charAt(0).toUpperCase())}</span><div><b>${esc(p.nome || 'Sem nome')}</b><small>${esc(pfRot('objetivo', p.objetivo))} · ${esc(pfRot('dias', p.dias))}</small></div></div>
    <div class="pfstats"><div><b>${esc(p.peso ?? '—')}</b><small>kg</small></div><div><b>${esc(p.altura ?? '—')}</b><small>cm</small></div><div><b>${imc}</b><small>IMC</small></div></div>
    <div class="field"><label for="pf-nome">Nome</label><input class="inp" id="pf-nome" data-a="pfCampo" data-k="nome" value="${esc(p.nome || '')}"></div>
    ${num('idade', 'Idade', 'anos')}${num('peso', 'Peso', 'kg')}${num('altura', 'Altura', 'cm')}
    ${sel('sexo')}${sel('objetivo')}${sel('nivel')}${sel('dias')}${sel('local')}
    <div class="field"><label>Lesões ou dores</label><div class="obops">${PF.lesoes.map(([v, n]) => `<button class="chip" data-a="pfLes" data-v="${v}" aria-pressed="${(p.lesoes || []).includes(v)}">${esc(n)}</button>`).join('')}</div></div>
    ${c === 'pf:gerar' ? `<p class="aviso">Cria um novo treino com estes dados e passa a usá-lo. Os treinos atuais ficam como rascunho.</p><div class="confirm"><button class="btn ghost" data-a="cancelar">Cancelar</button><button class="btn" data-a="pfGerar">Gerar</button></div>`
      : `<button class="btn" data-a="pfPedirGerar">Gerar nova ficha com estes dados</button>`}
    <button class="btn sec" data-a="pfRefazer">Refazer as perguntas</button>
    ${c === 'pf:apagar' ? `<div class="confirm"><button class="btn ghost" data-a="cancelar">Manter</button><button class="btn" data-a="pfApagar">Apagar perfil</button></div>`
      : `<button class="btn ghost perigo" data-a="pfPedirApagar">Apagar perfil</button><p class="aviso">Apagar o perfil não apaga treinos nem histórico.</p>`}
    <p class="aviso">As fichas geradas são um ponto de partida. Em caso de dor ou condição de saúde, consulte um profissional.</p>
  </main>`;
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a^="pf"]'); if (!b) return;
  const a = b.dataset.a, o = S.ob, st = o && OB[o.p];
  switch (a) {
    case 'pfRefazer': iniciarOb(); break;
    case 'pfPular': S.ob = null; tab('home'); break;
    case 'pfAnt': o.p = Math.max(0, o.p - 1); render(true); break;
    case 'pfOp': o.d[st.k] = st.k === 'dias' ? +b.dataset.v : b.dataset.v; if (o.p < OB.length - 1) { o.p++; render(true); } break;
    case 'pfMulti': { const l = o.d.lesoes, v = b.dataset.v, i = l.indexOf(v); i < 0 ? l.push(v) : l.splice(i, 1); render(); break; }
    case 'pfProx': {
      if (st.tipo === 'texto') { const v = ($('#ob-in').value || '').trim(); if (!v) { toast('Digite um nome'); break; } o.d[st.k] = v; }
      else if (st.tipo === 'num') { const v = num($('#ob-in').value); if (v < st.min || v > st.max) { toast(`Informe um valor entre ${st.min} e ${st.max}`); break; } o.d[st.k] = v; }
      if (o.p === OB.length - 1) obFinalizar(); else { o.p++; render(true); }
      break;
    }
    case 'pfLes': { const l = [...(S.perfil.lesoes || [])], v = b.dataset.v, i = l.indexOf(v); i < 0 ? l.push(v) : l.splice(i, 1); salvarPerfil({ lesoes: l }); render(); break; }
    case 'pfPedirGerar': S.confirmar = 'pf:gerar'; render(); break;
    case 'pfPedirApagar': S.confirmar = 'pf:apagar'; render(); break;
    case 'pfGerar': { S.confirmar = null; const pid = gerarDoPerfil(S.perfil); toast('Ficha criada'); S.pilha = [{ v: 'treinos' }]; S.view = { v: 'prog', id: pid }; render(true); break; }
    case 'pfApagar': S.confirmar = null; S.perfil = null; Store.del('perfil', 'eu'); toast('Perfil apagado'); render(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target; if (t.dataset.a === 'pfIn' && S.ob) S.ob.d[OB[S.ob.p].k] = OB[S.ob.p].tipo === 'num' ? t.value.replace(/[^\d.,]/g, '') : t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target; if (t.dataset.a !== 'pfCampo') return;
  const k = t.dataset.k, def = OB.find(x => x.k === k);
  if (k === 'nome') { const v = t.value.trim(); if (!v) { render(); return; } salvarPerfil({ nome: v }); }
  else if (def && def.tipo === 'num') { const v = num(t.value); if (v < def.min || v > def.max) { toast(`Informe um valor entre ${def.min} e ${def.max}`); render(); return; } salvarPerfil({ [k]: v }); }
  else salvarPerfil({ [k]: k === 'dias' ? +t.value : t.value });
  render();
});

// ---------- início ----------
render();
Store.init().then(() => {
  let n = 0, migrou = false; const ok = () => { if (++n >= 5) { S.pronto = true; migrar(); abrirOb(); } };
  const migrar = () => {
    if (migrou || !S.pronto) return; const soltas = S.fichas.filter(f => !f.prog || !S.programas.some(p => p.id === f.prog)); migrou = true;
    if (!soltas.length) return;
    const p = progAtivo() || novoProg('Treino 1', true);
    soltas.forEach(f => salvarFicha({ ...clone(f), prog: p.id }));
  };
  Store.watch('programas', docs => { S.programas = docs; ok(); safeRender(); });
  Store.watch('aerobicos', docs => { S.aerobicos = docs; ok(); safeRender(); });
  Store.watch('perfil', docs => { S.perfil = docs.find(d => d.id === 'eu') || null; ok(); });
  Store.watch('fichas', docs => { S.fichas = docs.map(d => ({ ...d, itens: d.itens || [] })); ok(); if (S.view.v !== 'treino' || !document.activeElement || document.activeElement.tagName !== 'INPUT') safeRender(); });
  Store.watch('sessoes', docs => { S.sessoes = docs.sort((a, b) => (b.data || '').localeCompare(a.data || '')); ok(); safeRender(); });
});
function safeRender() { const a = document.activeElement; if (a && a.tagName === 'INPUT') return; render(); }

</script>

<script>
// app instalável: funciona offline e pede para o iPhone não apagar os dados
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
