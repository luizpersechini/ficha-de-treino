<style>
/* =====================================================================
   Ficha de Treino · redesign visual v2
   Substitui o bloco <style> inteiro do arquivo. Mantém todas as classes
   e data-a atuais. Blocos marcados [NOVO] dependem das pequenas mudanças
   de template listadas no fim do arquivo; sem elas o CSS degrada para o
   visual atual, sem quebrar nada.

   Três camadas de hierarquia:
   · AÇÃO .......... preenchido (accent sólido). Treinar, Concluir, check.
   · INFORMAÇÃO .... rebaixado (--inst, sem borda). Saúde, metas, aeróbico.
   · CONFIGURAÇÃO .. contornado (--surface + borda --line2). Editor, campos.
   ===================================================================== */

/* ---------- tokens ---------- */
/* Layout: app escuro de academia; cartões sem borda com profundidade, ação em coral sólido, informação em painéis rebaixados. */
:root, [data-theme="light"] {
  --bg: #F1F2F4; --surface: #FFFFFF; --surface2: #EDEFF2; --inst: #E7EAEE;
  --ink: #0F1318; --muted: #5A636E; --line: #E4E7EB; --line2: #D2D7DD; --track: #DCE0E5;
  --accent: #E5431F; --accent2: #F29A83; --accent-ink: #FFFFFF; --accent-bg: #FDE7E0;
  --ok: #0F8A5A; --okbg: #DDF3E8; --warn: #9A5B00; --warnbg: #FCEBD0; --bad: #C0271B; --badbg: #FCE2DF;
  --fig: #3A434E; --fig-hi: #66717E; --fig2: #B6BDC5; --fig2-lo: #9AA3AD; --prop: #8A94A0; --propf: #C3C9D0;
  --mu-hi: #FF8A66; --mu-lo: #B82E12; --mu2-lo: #E07A60;
  --stage: #E3E7EB; --stage-hi: #F8F9FA;
  --shadow: 0 1px 2px rgba(15, 20, 30, .05), 0 12px 28px -16px rgba(15, 20, 30, .22);
  --display: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-s: 10px; --r: 14px; --r-l: 22px;
  --tap: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0B0E; --surface: #16181D; --surface2: #202329; --inst: #111317;
    --ink: #F2F4F7; --muted: #9BA4AF; --line: #23262D; --line2: #30343C; --track: #262A31;
    --accent: #FF5A36; --accent2: #FF9E85; --accent-ink: #1A0906; --accent-bg: #3A1810;
    --ok: #3DDC97; --okbg: #0F281D; --warn: #FFB547; --warnbg: #33260F; --bad: #FF6B5B; --badbg: #3A1512;
    --fig: #AEB6C0; --fig-hi: #F4F6F8; --fig2: #3E444D; --fig2-lo: #2C3138; --prop: #6B7480; --propf: #383E47;
    --mu-hi: #FF9A78; --mu-lo: #C8361A; --mu2-lo: #C9705A;
    --stage: #111318; --stage-hi: #22262E;
    --shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 14px 30px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
[data-theme="dark"] {
  --bg: #0A0B0E; --surface: #16181D; --surface2: #202329; --inst: #111317;
  --ink: #F2F4F7; --muted: #9BA4AF; --line: #23262D; --line2: #30343C; --track: #262A31;
  --accent: #FF5A36; --accent2: #FF9E85; --accent-ink: #1A0906; --accent-bg: #3A1810;
  --ok: #3DDC97; --okbg: #0F281D; --warn: #FFB547; --warnbg: #33260F; --bad: #FF6B5B; --badbg: #3A1512;
  --fig: #AEB6C0; --fig-hi: #F4F6F8; --fig2: #3E444D; --fig2-lo: #2C3138; --prop: #6B7480; --propf: #383E47;
  --mu-hi: #FF9A78; --mu-lo: #C8361A; --mu2-lo: #C9705A;
  --stage: #111318; --stage-hi: #22262E;
  --shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 14px 30px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
/* modo treino: sempre escuro */
.treino {
  --bg: #060709; --surface: #14161B; --surface2: #1E2127; --inst: #0E1014;
  --ink: #F5F7FA; --muted: #A2ABB6; --line: #22252C; --line2: #343841; --track: #24282F;
  --accent: #FF5A36; --accent2: #FF9E85; --accent-ink: #1A0906; --accent-bg: #3A1810;
  --ok: #3DDC97; --okbg: #0E2A1D; --warn: #FFB547; --warnbg: #33260F; --bad: #FF6B5B; --badbg: #3A1512;
  --fig: #AEB6C0; --fig-hi: #F4F6F8; --fig2: #3E444D; --fig2-lo: #2C3138; --prop: #6B7480; --propf: #383E47;
  --mu-hi: #FF9A78; --mu-lo: #C8361A; --mu2-lo: #C9705A;
  --stage: #0D0F13; --stage-hi: #1F232A;
  --shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 14px 30px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input:focus-visible { outline-offset: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

#app { min-height: 100%; background: var(--bg); padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- tipografia ---------- */
.eyebrow { font: 600 12px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.en { color: var(--muted); font-size: 14px; }
h2 { font: 800 18px/1.1 var(--display); letter-spacing: -.015em; margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 6px; min-height: 60px; }
.top h1 { font: 800 21px/1.05 var(--display); letter-spacing: -.015em; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { width: 48px; height: 48px; margin-left: -12px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; flex: none; }
.back svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- navegação inferior ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: flex; gap: 6px; padding-block: 8px; }
.nav button { flex: 1; min-height: 52px; border: 0; border-radius: var(--r); background: none; font: 600 14px var(--body); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface2); }
.nav button[aria-current="page"] svg { stroke: var(--accent); }
.nav .go { background: var(--accent); color: var(--accent-ink); flex: 1.1; }
.nav .go svg { fill: currentColor; }
.nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- bonecos (figuras SVG) ---------- */
.fig { display: block; width: 100%; height: auto; }
.bd { stroke: var(--fig); } .bdf { fill: var(--fig); } .bd2 { stroke: var(--fig2); }
.hi { stroke: var(--accent); fill: var(--accent); } .hi2 { stroke: var(--accent2); fill: var(--accent2); }
.pr { stroke: var(--prop); } .prf { fill: var(--propf); } .bg { fill: var(--stage); }
/* palco: fundo próprio, sempre mais escuro/claro que o card, para o músculo saltar */
.thumb, .frame, .stage figure { background: var(--stage); border-radius: var(--r); }

/* ---------- botões (camada AÇÃO) ---------- */
.btn { min-height: 56px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); font: 800 16px/1 var(--display); letter-spacing: -.015em; padding-inline: 20px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(.985); }
.btn.sec { background: var(--surface2); color: var(--ink); }
.btn.ghost { background: none; box-shadow: inset 0 0 0 1.5px var(--line2); color: var(--ink); }
.btn.ok { background: var(--ok); color: var(--bg); }
.btn:disabled { opacity: .4; }
.btns { display: grid; gap: 10px; }
.perigo { color: var(--bad) !important; }
.confirm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.aviso { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

/* chips */
.chip { border: 1.5px solid var(--line2); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 44px; font-weight: 600; font-size: 15px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--okbg); color: var(--ok); }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.off { background: var(--surface2); color: var(--muted); }
.tag.off::before { display: none; }

/* ---------- início: grupos ---------- */
.intro { padding-block: 12px 4px; display: grid; gap: 4px; }
.intro p { margin: 0; color: var(--muted); font-size: 15px; }
.alvo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; font-size: 14px; color: var(--muted); }
.grupos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
/* treino em andamento: bloco invertido (AÇÃO) */
.emcurso { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 14px 12px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.emcurso .eyebrow { color: inherit; opacity: .72; }
.emcurso b { display: block; font: 800 18px/1.1 var(--display); letter-spacing: -.015em; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.emcurso small { display: block; font-size: 14px; opacity: .78; margin-top: 2px; }
.emcurso .btn { width: auto; min-height: 52px; font-size: 18px; padding-inline: 16px; }
.emcurso .btn svg { width: 16px; height: 16px; fill: currentColor; }
/* ficha que recebe os exercícios (CONFIGURAÇÃO) */
.alvobar { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1.5px solid var(--line2); border-radius: var(--r-l); padding: 10px 10px 10px 14px; min-height: 68px; }
.alvobar > span:first-child { min-width: 0; }
.alvobar b { display: block; font: 800 17px/1.1 var(--display); letter-spacing: -.015em; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alvobar small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.alvobar .troca { display: flex; align-items: center; gap: 4px; min-height: 44px; font-weight: 600; font-size: 14px; background: var(--surface2); border-radius: 999px; padding: 0 12px 0 14px; }
.alvobar .troca svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.home { display: grid; gap: 12px; padding-block: 4px 16px; }
.home .aerhome { margin-top: 0; }
/* grupos musculares: boneco em palco próprio */
.gcard { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-l); padding: 0; text-align: left; display: grid; overflow: hidden; }
.gcard:active { transform: scale(.985); }
.gcard .gstage { display: flex; justify-content: center; align-items: flex-end; background: var(--stage); height: 164px; padding-top: 10px; }
.gcard .gstage .fig { height: 100%; width: auto; max-width: 100%; }
.gcard .gtx { display: grid; gap: 1px; padding: 10px 12px 12px; }
.gcard b { font: 800 17px/1.05 var(--display); letter-spacing: -.015em; }
.gcard .gtx span { font-size: 13px; color: var(--muted); }
.gcard .gnum { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; letter-spacing: -.015em; padding: 4px 8px; border-radius: 999px; background: var(--ok); color: var(--surface); }
.grupos { padding-block: 0 8px; }

/* ---------- lista de exercícios ---------- */
.lista { display: grid; padding-block: 8px 20px; }
.row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 48px; gap: 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.row .thumb { padding: 2px; }
.row .txt { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 1px; min-height: 48px; }
.row .txt b { font-weight: 600; font-size: 16px; line-height: 1.25; }
.row .txt small { color: var(--muted); font-size: 13px; }
.add { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line2); background: var(--surface); display: grid; place-items: center; }
.add svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.add[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.add[aria-pressed="true"] svg { stroke: var(--accent-ink); }

/* ---------- detalhe do exercício ---------- */
.det { padding-block: 12px 24px; display: grid; gap: 18px; }
.det h2 { font-size: 28px; letter-spacing: -.02em; }
.frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.frames.um { grid-template-columns: minmax(0, 360px); justify-content: center; }
.frame { overflow: hidden; position: relative; }
.frame figcaption { position: absolute; left: 10px; top: 10px; font: 800 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; }
.frame figcaption i { font-style: normal; color: var(--accent); }
figure { margin: 0; }
.mus { display: grid; gap: 10px; }
.mus div { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: translateY(1px); }
.dot.s { background: var(--accent2); }
.mus small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.cue { margin: 0; font-size: 17px; line-height: 1.5; max-width: 60ch; }
.spec { display: flex; gap: 22px; flex-wrap: wrap; color: var(--muted); font-size: 13px; background: var(--inst); border-radius: var(--r-l); padding: 12px 16px; }
.spec b { color: var(--ink); font: 800 20px/1 var(--display); display: block; margin-bottom: 2px; }

/* ---------- treinos / fichas ---------- */
.fichas { display: grid; gap: 12px; padding-block: 8px 24px; }
.fichas > .eyebrow { margin-top: 10px; }
.lead { margin: 0; color: var(--muted); font-size: 14px; }

/* programa: cabeçalho informativo + fichas como linhas de ação */
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0; display: grid; overflow: hidden; }
.pcard.on { border: 2px solid var(--ink); }
.pcard header, .pcard .pcard-hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; }
.pcard .pcard-hd { width: 100%; border: 0; background: none; text-align: left; min-height: 96px; }
.pcard h2 { font-size: 20px; margin-top: 6px; }
.pcard .meta { color: var(--muted); font-size: 14px; display: block; margin-top: 3px; }
.pcard > ul:not(.pfichas) { list-style: none; margin: 0; padding: 0 16px 16px; display: flex; flex-wrap: wrap; gap: 6px; }
.pcard > ul:not(.pfichas) li { background: var(--surface2); border-radius: 6px; padding: 4px 9px; font-size: 13px; font-weight: 600; }
/* [NOVO] fichas do treino em uso, com Treinar direto */
.pfichas { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.pfichas li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border-top: 1px solid var(--line); }
.pfichas li:first-child { border-top: 0; }
.pfichas b { display: block; font: 800 16px/1.1 var(--display); letter-spacing: -.015em; }
.pfichas small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.pfichas .btn { width: auto; min-height: 48px; font-size: 17px; padding-inline: 18px; }
.pfichas .btn svg { width: 16px; height: 16px; fill: currentColor; }

.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; display: grid; gap: 12px; }
.fcard header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.fcard header .meta { display: block; margin-top: 3px; }
.fcard.off { opacity: .6; }
.fcard h2 { font-size: 19px; }
.fcard .meta { color: var(--muted); font-size: 13px; }
.fcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fcard li { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: 13px; }
.fcard .li-cardio { background: var(--okbg); color: var(--ok); font-weight: 600; }
.fcard .acts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.fcard .acts .btn { min-height: 50px; font-size: 17px; }
.vazio { padding: 28px 4px; display: grid; gap: 14px; }
.vazio p { margin: 0; color: var(--muted); }
.uso { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }

.modelos { display: grid; gap: 8px; }
.modelo { text-align: left; border: 1.5px dashed var(--line2); background: none; border-radius: var(--r); padding: 12px 14px; display: grid; gap: 3px; min-height: 60px; }
.modelo b { font: 800 15px/1.15 var(--display); letter-spacing: -.015em; }
.modelo small { color: var(--muted); font-size: 13px; line-height: 1.4; }

/* ---------- nota (selo) como mostrador circular ---------- */
/* [NOVO] precisa de style="--s:NN" no .selo; sem ele o anel aparece cheio */
.selo { --c: var(--ok); --s: 100; --bgc: var(--surface); position: relative; flex: none; width: 76px; height: 76px; border-radius: 50%;
  background: conic-gradient(var(--c) calc(var(--s) * 3.6deg), var(--track) 0);
  display: grid; place-content: center; justify-items: center; text-align: center;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 1.1; color: var(--c); }
.selo::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bgc); }
.selo > * { position: relative; }
.selo b { position: relative; font: 800 25px/0.9 var(--display); color: var(--ink); letter-spacing: 0; }
.selo { isolation: isolate; }
.selo::before { z-index: -1; }
.selo.warn { --c: var(--warn); } .selo.bad { --c: var(--bad); }
.fcard .selo, .pfichas .selo { width: 48px; height: 48px; font-size: 0; }
.fcard .selo::before, .pfichas .selo::before { inset: 5px; }
.fcard .selo b, .pfichas .selo b { font-size: 20px; }
.saude .selo { --bgc: var(--inst); width: 96px; height: 96px; font-size: 11px; }
.saude .selo::before { inset: 9px; }
.saude .selo b { font-size: 40px; }

/* ---------- saúde da ficha / do treino (camada INFORMAÇÃO) ---------- */
.saude { background: var(--inst); border: 0; border-radius: 18px; padding: 16px; display: grid; gap: 14px; }
.saude header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.saude header h2 { font-size: 26px; margin-top: 2px; }
.saude .meta { display: block; margin-top: 6px; font: 800 14px/1.2 var(--display); letter-spacing: .02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.checks li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; padding-block: 12px; border-top: 1px solid var(--line); }
.checks li:first-child { border-top: 0; padding-top: 0; }
.checks .ic, .oks summary .ic, .aerlinha .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.checks .ic svg, .oks summary .ic svg, .aerlinha .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.checks .ok .ic { background: var(--okbg); color: var(--ok); }
.checks .warn .ic { background: var(--warn); color: var(--inst); }
.checks .bad .ic { background: var(--bad); color: var(--inst); }
.checks b { font-weight: 600; font-size: 15px; }
.checks p { margin: 2px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.sub { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.sub span { text-transform: none; letter-spacing: 0; font-weight: 400; }
.saude details { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 4px; }
.saude summary { cursor: pointer; font-weight: 600; color: var(--ink); min-height: 44px; display: flex; align-items: center; gap: 10px; }
.saude details p { margin: 6px 0 0; line-height: 1.5; }
.oks summary { font-size: 15px; }
.oks summary .ic { background: var(--okbg); color: var(--ok); }
.oks .checks { margin-top: 6px; }

/* barras de volume semanal */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 13px; }
.bar > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk { position: relative; height: 16px; background: var(--track); border-radius: 4px; }
.trk .zone { position: absolute; top: 0; bottom: 0; background: var(--surface); border-radius: 3px; opacity: .9; }
.trk .fill { position: absolute; left: 0; top: 4px; height: 8px; border-radius: 0 4px 4px 0; background: var(--warn); }
.trk .fill.ok { background: var(--ok); }
.val { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.val b { font-size: 18px; color: var(--ink); }
.val svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.val.ok { color: var(--ok); } .val.baixo, .val.alto { color: var(--warn); }
.bar.leg .trk { height: 16px; background: none; }
.bar.leg .zone { opacity: 0; }
.bar.leg em { position: absolute; top: 0; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar.leg em:last-child { transform: translateX(-100%); }

/* ---------- editor da ficha (camada CONFIGURAÇÃO) ---------- */
.ed { display: grid; gap: 14px; padding-block: 4px 28px; }
.field { display: grid; gap: 6px; }
.field label, .ctl label, .ctl2 label, .aerform label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.inp { min-height: 48px; border-radius: var(--r); border: 1.5px solid var(--line2); background: var(--surface); padding: 8px 12px; font-size: 17px; width: 100%; }
.inp::placeholder { color: var(--muted); opacity: .7; }
/* grupo de configurações: nome + vezes/semana num só bloco */
.cfg { background: var(--surface); border: 1.5px solid var(--line2); border-radius: var(--r-l); display: grid; }
.cfg > * + * { border-top: 1px solid var(--line); }
.cfg .field { padding: 10px 14px 12px; }
.cfg .inp { border: 0; padding: 0; min-height: 36px; font: 800 18px/1.1 var(--display); background: none; }
.vezes { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--line2); border-radius: var(--r-l); padding: 10px 10px 10px 14px; }
.cfg .vezes { border: 0; border-radius: 0; background: none; }
.vezes b { font-weight: 600; display: block; }
.vezes small { color: var(--muted); font-size: 13px; }
.vezes .step { width: 148px; }

/* stepper e faixa: alvos de 48 px */
.step { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; border: 1.5px solid var(--line2); border-radius: var(--r); min-height: 48px; background: var(--surface); }
.step button { border: 0; background: none; height: 46px; font-size: 22px; font-weight: 600; border-radius: 10px; color: var(--ink); }
.step button:active { background: var(--surface2); }
.step span { text-align: center; font: 800 18px var(--display); font-variant-numeric: tabular-nums; }
.faixa { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2px; border: 1.5px solid var(--line2); border-radius: var(--r); min-height: 48px; padding-inline: 4px; background: var(--surface); }
.faixa input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font: 800 18px var(--display); padding: 0; min-height: 44px; border-radius: 8px; }
.faixa span { color: var(--muted); font-weight: 600; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
.sec-h .num { font-size: 17px; color: var(--muted); }

/* item de exercício: resumo em uma linha, controles ao abrir */
.item { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-l); padding: 0; display: grid; }
.item[open] { border-color: var(--line2); }
.item > summary { list-style: none; cursor: pointer; }
.item > summary::-webkit-details-marker { display: none; }
.item .hd { display: grid; grid-template-columns: 64px minmax(0, 1fr) 28px; gap: 12px; align-items: center; padding: 10px 10px 10px 10px; min-height: 84px; }
.item .hd .thumb { position: relative; padding: 0; }
.item .hd .ord { position: absolute; left: -4px; top: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--ink); color: var(--bg); font: 700 13px/22px var(--display); text-align: center; padding-inline: 5px; }
.item .hd b { font-weight: 600; line-height: 1.25; display: block; }
.item .hd small { display: block; color: var(--muted); font-size: 12px; }
.item .hd .chev { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.item[open] .hd .chev { transform: rotate(180deg); }
/* resumo: séries × reps · descanso · carga início → alvo */
.resumo { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font: 800 13px/1.2 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.resumo span { white-space: nowrap; }
.resumo .kg { color: var(--accent); }
.resumo .d { color: var(--muted); }
.item .hd .obs { display: block; margin-top: 3px; font-size: 13px; font-style: italic; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .corpo { display: grid; gap: 12px; padding: 4px 12px 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.item .ctl, .item .ctl2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ctl > div, .ctl2 > div { display: grid; gap: 5px; min-width: 0; }
.ctl2 .inp { min-height: 48px; font-size: 16px; padding: 6px 12px; }
.mini { display: flex; gap: 8px; }
.mini button { flex: 1; min-height: 44px; border-radius: 10px; border: 0; background: var(--surface2); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; }
.mini svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mini button:disabled { opacity: .35; }
.mini [data-a="tirar"] { color: var(--bad); background: var(--badbg); }
.item.cardio .hd2 { display: grid; gap: 2px; }
.item.cardio .hd2 b { font-weight: 600; line-height: 1.25; }
.item.cardio .hd2 small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.item.cardio .ico { width: 64px; height: 64px; border-radius: var(--r); background: var(--okbg); color: var(--ok); display: grid; place-items: center; }
.item.cardio .ico svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- modo treino ---------- */
.treino { background: var(--bg); color: var(--ink); min-height: 100vh; min-height: 100dvh; }
.tbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.tbar .wrap { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.tbar h1 { flex: 1; min-width: 0; margin: 0; font: 800 18px/1.05 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar h1 small { display: block; margin-top: 3px; font: 600 16px var(--body); text-transform: none; color: var(--muted); }
.tbar .clock { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
/* progresso: barra grossa; com .segs vira um segmento por exercício */
.prog { height: 8px; margin: 0 16px 10px; border-radius: 4px; background: var(--track); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .3s; }
.prog.segs { display: flex; gap: 4px; background: none; overflow: visible; }
.prog.segs i { flex: var(--n, 1); border-radius: 3px; background: linear-gradient(90deg, var(--ok) calc(var(--p, 0) * 100%), var(--track) 0); }

.tlist { display: grid; gap: 12px; padding-block: 6px 270px; }
.tcard { background: var(--surface); border-radius: 20px; border: 1.5px solid var(--line); overflow: hidden; }
.tcard.feito { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
/* exercício atual = primeiro card não concluído (sem JS) */
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) { border: 2px solid var(--ink); }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) h3::before { content: "Agora"; display: block; font: 700 13px/1 var(--body); letter-spacing: .14em; color: var(--accent); margin-bottom: 6px; }
.tcard.feito h3::after { content: " · feito"; color: var(--ok); }

.tcard .th { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 14px 14px 10px; align-items: center; }
.tcard .th > .fig { background: var(--stage); border-radius: var(--r); }
/* [NOVO] palco com início e fim, grande no exercício atual */
.stage { display: grid; grid-template-columns: 1fr; }
.stage figure { position: relative; overflow: hidden; }
.stage figure:first-child { display: none; }
.stage figcaption { display: none; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .th { grid-template-columns: 1fr; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .stage { grid-template-columns: 1fr 1fr; gap: 8px; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .stage figure:first-child { display: block; }
.stage.um figure:first-child { display: block; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .stage.um { grid-template-columns: minmax(0, 220px); justify-content: center; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .stage figcaption { display: block; position: absolute; left: 10px; top: 9px; font: 800 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tcard h3 { margin: 0; font: 800 21px/1.02 var(--display); letter-spacing: -.015em; }
.tcard .ant { font-size: 15px; color: var(--muted); margin-top: 4px; }
.tcard .ant b { color: var(--ink); font-weight: 600; }
.tcard .ant.obs { font-style: italic; color: var(--ink); opacity: .85; font-size: 16px; }
/* [NOVO] metas como leitura de instrumento */
.alvos { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; margin: 10px 0 0; background: var(--line); border-radius: var(--r); overflow: hidden; }
.alvos > div { background: var(--inst); padding: 8px 10px; }
.alvos dt { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.alvos dd { margin: 2px 0 0; font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.alvos dd small { font: 600 13px var(--body); color: var(--muted); margin-left: 2px; }
.alvos .kg dd { color: var(--accent); }

.sug { margin: 0 14px 10px; padding: 10px 12px; border-radius: var(--r); font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; background: var(--inst); }
.sug.sobe { background: var(--okbg); color: var(--ok); }
.sug svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* séries: números grandes, check de 76 × 64 */
.sets { display: grid; }
.sets-h { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 76px; gap: 8px; padding: 6px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.set { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 76px; gap: 8px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); }
.set .n { font: 800 20px var(--display); color: var(--muted); text-align: center; }
.set label { position: relative; display: block; }
.set label span { position: absolute; right: 10px; bottom: 9px; font-size: 13px; font-weight: 600; color: var(--muted); pointer-events: none; }
.set input { width: 100%; min-height: 64px; border-radius: 14px; border: 2px solid var(--line2); background: var(--bg); text-align: center; padding: 0 26px 0 6px; font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.set input::placeholder { color: var(--muted); opacity: .55; }
.set input:focus { border-color: var(--ink); outline: none; }
.set .ck { width: 76px; height: 64px; border-radius: 14px; border: 2px solid var(--line2); background: none; display: grid; place-items: center; }
.set .ck svg { width: 32px; height: 32px; stroke: var(--muted); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* próxima série do exercício atual: check vira alvo */
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .set:not(.ok):not(.set:not(.ok) ~ .set) { background: var(--surface2); }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .set:not(.ok):not(.set:not(.ok) ~ .set) .ck { border-color: var(--ok); border-width: 3px; }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .set:not(.ok):not(.set:not(.ok) ~ .set) .ck svg { stroke: var(--ok); }
.tcard:not(.feito):not(.tcard:not(.feito) ~ .tcard) .set:not(.ok):not(.set:not(.ok) ~ .set) .n { color: var(--ink); }
.set.ok { background: var(--okbg); }
.set.ok .n { color: var(--ok); }
.set.ok .ck { background: var(--ok); border-color: var(--ok); }
.set.ok .ck svg { stroke: var(--bg); }
.set.ok input { border-color: transparent; background: transparent; color: var(--ok); }
.tfoot { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.tfoot button { flex: 1; min-height: 48px; border-radius: var(--r); border: 1.5px dashed var(--line2); background: none; color: var(--ink); font-weight: 600; font-size: 15px; }
.aertreino .th2 { padding: 14px 14px 0; display: grid; gap: 4px; }
.aertreino .tfoot { margin: 10px -14px 0; }
.aertreino .tfoot [data-a="aerPlanoOk"] { background: var(--ok); color: var(--bg); border: 0; font-weight: 700; }

/* dock inferior: descanso + concluir */
.fim { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.fim .wrap { display: grid; gap: 10px; }
/* enquanto houver série pendente, Concluir fica contornado: evita toque acidental */
.treino:has(.set:not(.ok)) .fim [data-a="concluir"]:not(:disabled) { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line2); min-height: 52px; font-size: 17px; }
/* [NOVO] cronômetro de descanso */
.descanso { background: var(--surface); border: 2px solid var(--accent); border-radius: 18px; padding: 12px 12px 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.descanso .rot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
.descanso .rot b { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.descanso .t { font: 800 52px/0.95 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.descanso .acts { display: flex; gap: 6px; }
.descanso .acts button { min-width: 56px; height: 56px; border-radius: 14px; border: 0; background: var(--surface2); font: 800 14px var(--display); letter-spacing: .02em; padding-inline: 10px; }
.descanso .acts [data-a="descPular"] { background: var(--ink); color: var(--bg); }
.descanso .trk2 { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
.descanso .trk2 i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.descanso.fimdesc { border-color: var(--ok); }
.descanso.fimdesc .rot b, .descanso.fimdesc .t { color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .descanso.fimdesc { animation: pulso 1s ease-in-out 3; } }
@keyframes pulso { 50% { background: var(--okbg); } }

/* ---------- aviso, folha inferior, status ---------- */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r); font-size: 15px; font-weight: 500; max-width: calc(100% - 32px); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(6, 10, 14, .6); display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 0 calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; overflow: auto; }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto 12px; }
.sheet .wrap { display: grid; gap: 10px; }
.sheet .en { margin-top: -4px; }
.sheet .opt { min-height: 56px; border-radius: var(--r); border: 1.5px solid var(--line2); background: var(--bg); text-align: left; padding: 0 14px; font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.sheet .opt[aria-pressed="true"] { border: 2px solid var(--accent); }
.status { font-size: 13px; color: var(--muted); text-align: center; padding: 18px 0 4px; }

/* ---------- histórico ---------- */
.hist { background: var(--inst); border-radius: var(--r-l); padding: 14px 16px; display: grid; gap: 10px; }
.hist .pr { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.hist .pr b { font-size: 24px; color: var(--ink); }
.hist ol { list-style: none; margin: 0; padding: 0; display: grid; }
.hist li { display: grid; grid-template-columns: 58px minmax(0, 1fr); column-gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist li > span { color: var(--muted); grid-row: span 2; }
.hist li b { font-size: 19px; }
.hist li small { color: var(--muted); font-size: 12px; }

/* ---------- aeróbico ---------- */
.aerhome { background: var(--inst); border-radius: var(--r-l); padding: 14px 16px; margin-top: 12px; display: grid; gap: 10px; }
.aerhome-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.aerbar { display: grid; gap: 8px; }
.aerbar-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.aerbar-t b { font-size: 30px; color: var(--ink); margin-right: 2px; }
.aerbar.compacta .aerbar-t b { font-size: 26px; font-weight: 800; }
.st-ok, .st-warn { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; }
.st-ok { color: var(--ok); } .st-warn { color: var(--warn); }
.st-ok svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.aertrk { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
.aertrk i { display: block; height: 100%; background: var(--fig); border-radius: 6px; }
.aertrk i.ok { background: var(--ok); }
.aerbar-d { font-size: 13px; color: var(--muted); }
.btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns2 .btn { font-size: 17px; }
.aerlist { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gCorpo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fig-hi)"/><stop offset="1" style="stop-color:var(--fig)"/></linearGradient>
<linearGradient id="gCorpo2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fig2)"/><stop offset="1" style="stop-color:var(--fig2-lo)"/></linearGradient>
<linearGradient id="gMu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mu-hi)"/><stop offset=".55" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--mu-lo)"/></linearGradient>
<linearGradient id="gMu2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--mu2-lo)"/></linearGradient>
</defs></svg>
<div id="app"></div>
<script>
// ===== Manequim paramétrico (vista lateral, olhando para a direita) =====
const FIG = (() => {
  const L = { torso: 50, neck: 7, head: 9.5, uarm: 29, farm: 26, thigh: 39, shin: 37, foot: 13 };
  const W = { torso: 21, uarm: 10, farm: 8.5, thigh: 14, shin: 10, foot: 6 };
  const rad = d => d * Math.PI / 180;
  const go = (p, len, deg) => [p[0] + len * Math.cos(rad(deg)), p[1] + len * Math.sin(rad(deg))];

  function joints(P) {
    const hip = [0, 0];
    const sh = go(hip, L.torso, P.torso);
    const neck = go(sh, L.neck, P.head ?? P.torso);
    const head = go(neck, L.head, P.head ?? P.torso);
    if (P.front) {
      const m = a => 180 - a, tl = L.thigh * (P.tl ?? 1);
      const shR = [sh[0] + 11, sh[1]], shL = [sh[0] - 11, sh[1]], hipR = [hip[0] + 6, hip[1]], hipL = [hip[0] - 6, hip[1]];
      const elb = go(shR, L.uarm, P.uarm), hand = go(elb, L.farm, P.farm);
      const elb2 = go(shL, L.uarm, m(P.luarm ?? P.uarm)), hand2 = go(elb2, L.farm, m(P.lfarm ?? P.farm));
      const knee = go(hipR, tl, P.thigh), ank = go(knee, L.shin, P.shin);
      const knee2 = go(hipL, tl, m(P.lthigh ?? P.thigh)), ank2 = go(knee2, L.shin, m(P.lshin ?? P.shin));
      const J = { hip, sh, neck, head, shR, shL, hipR, hipL, elb, hand, elb2, hand2, knee, ank, knee2, ank2,
        toe: [ank[0] + 6, ank[1] + 1], toe2: [ank2[0] - 6, ank2[1] + 1] };
      const a = J[P.anchor || 'hip'], t = P.at || [100, 100];
      for (const k in J) J[k] = [J[k][0] - a[0] + t[0], J[k][1] - a[1] + t[1]];
      return J;
    }
    const elb = go(sh, L.uarm, P.uarm), hand = go(elb, L.farm, P.farm);
    const knee = go(hip, L.thigh, P.thigh), ank = go(knee, L.shin, P.shin);
    const toe = go(ank, L.foot, P.foot ?? P.shin - 90);
    const J = { hip, sh, neck, head, elb, hand, knee, ank, toe };
    if (P.uarm2 != null) { J.elb2 = go(sh, L.uarm, P.uarm2); J.hand2 = go(J.elb2, L.farm, P.farm2); }
    if (P.thigh2 != null) { J.knee2 = go(hip, L.thigh, P.thigh2); J.ank2 = go(J.knee2, L.shin, P.shin2); J.toe2 = go(J.ank2, L.foot, P.foot2 ?? P.shin2 - 90); }
    const a = J[P.anchor || 'hip'], t = P.at || [100, 100];
    for (const k in J) J[k] = [J[k][0] - a[0] + t[0], J[k][1] - a[1] + t[1]];
    return J;
  }

  const f = n => n.toFixed(1);
  const seg = (a, b, w, cls) => `<line class="${cls}" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke-width="${w}" stroke-linecap="round"/>`;

  // ----- corpo com volume: cada parte é um contorno suave a partir de um perfil -----
  // perfil: [t ao longo do segmento, meia-largura do lado +N, meia-largura do lado −N]
  // +N segue a convenção do MAP (side +1): costas no tronco, bíceps no braço, quadríceps na coxa, canela na perna
  const PERFIL = {
    'hip-sh':   [[-0.13, 7.5, 6.5], [0.02, 11.5, 9.2], [0.28, 9.2, 8.4], [0.52, 10, 9.6], [0.76, 11.2, 11.4], [0.94, 9.6, 8.6], [1.05, 5.5, 5.5]],
    'sh-elb':   [[0, 6.4, 6.2], [0.18, 5.8, 6.3], [0.5, 6.1, 5.6], [0.84, 4.4, 4.5], [1, 3.9, 3.9]],
    'elb-hand': [[0, 4, 4], [0.24, 4.9, 4.5], [0.7, 3.4, 3.2], [1, 2.7, 2.7]],
    'hip-knee': [[0, 8.2, 9.6], [0.3, 8.8, 8.2], [0.7, 7.1, 6.5], [1, 5.2, 5.2]],
    'knee-ank': [[0, 5, 5.3], [0.28, 4.4, 7], [0.62, 3.6, 4.6], [1, 2.9, 3.1]],
    'ank-toe':  [[-0.1, 3.3, 3.3], [0.5, 2.6, 2.9], [1, 2, 2.2]],
    'sh-neck':  [[-0.2, 4, 4], [1.1, 3.6, 3.6]],
  };
  const FRENTE = {
    tronco: [[-0.12, 11, 11], [0.06, 12.5, 12.5], [0.34, 10.2, 10.2], [0.68, 12.6, 12.6], [0.93, 15.5, 15.5], [1.04, 11, 11]],
    coxa: [[0, 7.6, 7.6], [0.3, 8.1, 8.1], [1, 5, 5]], perna: [[0, 5, 5], [0.3, 5.6, 5.6], [1, 3, 3]],
    braco: [[0, 6.3, 6.3], [0.5, 5.8, 5.8], [1, 4, 4]], ante: [[0, 4.2, 4.2], [0.3, 4.6, 4.6], [1, 2.8, 2.8]], pe: [[-0.1, 3, 3], [1, 2.4, 2.4]],
  };
  const eixo = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1; return { dx, dy, n, nx: dy / n, ny: -dx / n }; };
  function suave(p) {
    const n = p.length; let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  }
  function forma(a, b, prof, cls) {
    const e = eixo(a, b), P = (t, o) => [a[0] + e.dx * t + e.nx * o, a[1] + e.dy * t + e.ny * o];
    const t0 = prof[0], t1 = prof[prof.length - 1];
    const pts = [...prof.map(([t, p]) => P(t, p)), P(t1[0] + (t1[1] + t1[2]) / 2 / e.n * 0.9, (t1[1] - t1[2]) / 2),
      ...prof.slice().reverse().map(([t, , m]) => P(t, -m)), P(t0[0] - (t0[1] + t0[2]) / 2 / e.n * 0.9, (t0[1] - t0[2]) / 2)];
    return `<path class="${cls}" d="${suave(pts)}"/>`;
  }
  const lerp = (prof, t, k) => { for (let i = 1; i < prof.length; i++) if (t <= prof[i][0]) { const [a, b] = [prof[i - 1], prof[i]], u = (t - a[0]) / (b[0] - a[0] || 1); return a[k] + (b[k] - a[k]) * u; } return prof[prof.length - 1][k]; };
  // região muscular: metade do membro (lado side) entre t0 e t1, acompanhando o contorno
  function regiao(a, b, prof, side, t0, t1, cls, cheio) {
    const ts = Array.from({ length: 6 }, (_, i) => t0 + (t1 - t0) * i / 5);
    const pr = ts.map(t => {
      const p = lerp(prof, t, 1) * 0.93, m = lerp(prof, t, 2) * 0.93;
      return cheio ? [t, p, m] : side > 0 ? [t, p, -0.6] : [t, -0.6, m];
    });
    return forma(a, b, pr, cls);
  }
  const corpo = (J, a, b, cls) => forma(J[a], J[b], PERFIL[a + '-' + b], cls);
  const cabeca = (J, cls) => { const e = eixo(J.neck, J.head), ang = Math.atan2(e.dy, e.dx) * 180 / Math.PI + 90;
    return `<ellipse class="${cls}" cx="${f(J.head[0])}" cy="${f(J.head[1])}" rx="8.4" ry="9.8" transform="rotate(${f(ang)} ${f(J.head[0])} ${f(J.head[1])})"/>`; };
  const mao = (p, cls) => `<circle class="${cls}" cx="${f(p[0])}" cy="${f(p[1])}" r="3.4"/>`;

  // músculo: segmento, lado (+1 = frente do membro / -1 = trás), trecho [t0,t1]
  const MAP = {
    peito:      { s: ['hip', 'sh'], side: -1, t: [0.6, 0.97] },
    abdomen:    { s: ['hip', 'sh'], side: -1, t: [0.06, 0.56] },
    dorsal:     { s: ['hip', 'sh'], side: 1, t: [0.4, 0.92] },
    lombar:     { s: ['hip', 'sh'], side: 1, t: [0.1, 0.4] },
    biceps:     { s: ['sh', 'elb'], side: 1, t: [0.22, 0.9] },
    triceps:    { s: ['sh', 'elb'], side: -1, t: [0.18, 0.9] },
    antebraco:  { s: ['elb', 'hand'], side: 1, t: [0.08, 0.72] },
    quadriceps: { s: ['hip', 'knee'], side: 1, t: [0.1, 0.92] },
    posterior:  { s: ['hip', 'knee'], side: -1, t: [0.12, 0.92] },
    panturrilha:{ s: ['knee', 'ank'], side: -1, t: [0.08, 0.62] },
  };
  const CLS_MU = { hi: 'mu', hi2: 'mu2' };

  function highlight(J, key, cls) {
    const c = CLS_MU[cls] || cls;
    if (key === 'ombro') return regiao(J.sh, J.elb, [[-0.2, 6.6, 6.6], [0.1, 7.6, 7.4], [0.42, 5, 5]], 1, -0.16, 0.42, c, true);
    if (key === 'gluteo') return regiao(J.hip, J.sh, PERFIL['hip-sh'], 1, -0.12, 0.3, c);
    const m = MAP[key]; if (!m) return '';
    return regiao(J[m.s[0]], J[m.s[1]], PERFIL[m.s.join('-')], m.side, m.t[0], m.t[1], c);
  }

  // ----- adereços -----
  const R = {
    chao: (y = 178) => `<line class="pr" x1="8" y1="${y}" x2="192" y2="${y}" stroke-width="2"/>`,
    banco: (x1, x2, y, fl = 178) => `<rect class="prf" x="${x1}" y="${y}" width="${x2 - x1}" height="7" rx="2"/>` + (fl ? seg([x1 + 8, y + 7], [x1 + 8, fl], 4, 'pr') + seg([x2 - 8, y + 7], [x2 - 8, fl], 4, 'pr') : ''),
    anilha: (p, r = 13) => `<circle class="prf" cx="${f(p[0])}" cy="${f(p[1])}" r="${r}"/><circle class="bg" cx="${f(p[0])}" cy="${f(p[1])}" r="2.5"/>`,
    halterH: (p, len = 16) => seg([p[0] - len / 2, p[1]], [p[0] + len / 2, p[1]], 3, 'pr') + `<rect class="prf" x="${f(p[0] - len / 2 - 3)}" y="${f(p[1] - 6)}" width="5" height="12" rx="1.5"/><rect class="prf" x="${f(p[0] + len / 2 - 2)}" y="${f(p[1] - 6)}" width="5" height="12" rx="1.5"/>`,
    halter: (p, r = 7) => `<circle class="prf" cx="${f(p[0])}" cy="${f(p[1])}" r="${r}"/>`,
    barraH: (p, len = 34) => seg([p[0] - len / 2, p[1]], [p[0] + len / 2, p[1]], 4, 'pr'),
    cabo: (a, b) => `<line class="pr" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke-width="1.6" stroke-dasharray="3 3"/>`,
    polia: p => `<circle class="pr" fill="none" cx="${f(p[0])}" cy="${f(p[1])}" r="5" stroke-width="2.5"/>`,
    // ponto ao longo de um segmento, deslocado para a frente (+) ou trás (-)
    at: (J, a, b, t, off = 0) => { a = J[a]; b = J[b]; const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy); return [a[0] + dx * t + dy / n * off, a[1] + dy * t - dx / n * off]; },
    seg: (a, b, w = 4) => seg(a, b, w, 'pr'),
    rolo: (p, r = 6) => `<circle class="prf" cx="${f(p[0])}" cy="${f(p[1])}" r="${r}"/>`,
  };

  function drawFront(P, ex, J) {
    const b = [], F = FRENTE;
    if (ex.props) b.push(ex.props(J, R));
    const perna = (h, k, a, t) => forma(h, k, F.coxa, 'bf') + forma(k, a, F.perna, 'bf') + forma(a, t, F.pe, 'bf');
    b.push(perna(J.hipR, J.knee, J.ank, J.toe), perna(J.hipL, J.knee2, J.ank2, J.toe2));
    b.push(forma(J.hip, J.sh, F.tronco, 'bf'), corpo(J, 'sh', 'neck', 'bf'), cabeca(J, 'bf'));
    const hiF = (keys, cls) => (keys || []).forEach(k => {
      const c = CLS_MU[cls];
      if (k === 'ombro') [[J.shR, J.elb], [J.shL, J.elb2]].forEach(([p, q]) => b.push(regiao(p, q, [[-0.25, 6.8, 6.8], [0.1, 7.6, 7.6], [0.45, 5, 5]], 1, -0.2, 0.45, c, true)));
      if (k === 'abdutor') [[J.hipR, J.knee, -1], [J.hipL, J.knee2, 1]].forEach(([p, q, sd]) => b.push(regiao(p, q, F.coxa, sd, -0.05, 0.35, c)));
      if (k === 'obliquo') [-1, 1].forEach(sd => b.push(regiao(J.hip, J.sh, F.tronco, sd, 0.08, 0.62, c)));
      if (k === 'abdomen') b.push(forma(R.at(J, 'hip', 'sh', 0.06), R.at(J, 'hip', 'sh', 0.62), [[0, 5, 5], [0.5, 6, 6], [1, 5.5, 5.5]], c));
      if (k === 'peito') b.push(forma(R.at(J, 'hip', 'sh', 0.66), R.at(J, 'hip', 'sh', 0.95), [[0, 9, 9], [0.6, 12, 12], [1, 11, 11]], c));
      if (k === 'quadriceps') [[J.hipR, J.knee], [J.hipL, J.knee2]].forEach(([p, q]) => b.push(regiao(p, q, F.coxa, 1, 0.1, 0.9, c, true)));
      if (k === 'posterior') [[J.hipR, J.knee], [J.hipL, J.knee2]].forEach(([p, q]) => b.push(regiao(p, q, F.coxa, 1, 0.16, 0.92, c, true)));
      if (k === 'gluteo') [-1, 1].forEach(sd => b.push(forma(R.at(J, 'hip', 'sh', -0.14, sd * 6), R.at(J, 'hip', 'sh', 0.14, sd * 6), [[0, 5.5, 5.5], [0.5, 6.6, 6.6], [1, 5, 5]], c)));
      if (k === 'dorsal') [-1, 1].forEach(sd => b.push(forma(R.at(J, 'hip', 'sh', 0.38, sd * 5), R.at(J, 'hip', 'sh', 0.9, sd * 10.5), [[0, 2.2, 2.2], [0.6, 4.6, 4.6], [1, 3.6, 3.6]], c)));
    });
    if (ex.costas) b.push(seg(R.at(J, 'hip', 'sh', 0.05), R.at(J, 'hip', 'sh', 0.97), 1.3, 'sp'));
    hiF(ex.hi2, 'hi2'); hiF(ex.hi, 'hi');
    if (ex.mid) b.push(ex.mid(J, R));
    const braco = (s, e, h) => forma(s, e, F.braco, 'bf o') + forma(e, h, F.ante, 'bf o') + mao(h, 'bf');
    b.push(braco(J.shR, J.elb, J.hand), braco(J.shL, J.elb2, J.hand2));
    if ((ex.hi || []).includes('ombro')) hiF(['ombro'], 'hi');
    else if ((ex.hi2 || []).includes('ombro')) hiF(['ombro'], 'hi2');
    ['biceps', 'triceps', 'antebraco'].forEach(k => [['hi2', ex.hi2], ['hi', ex.hi]].forEach(([cl, ks]) => (ks || []).includes(k) && [[J.shR, J.elb, J.hand], [J.shL, J.elb2, J.hand2]].forEach(([s1, e1, h1]) =>
      b.push(k === 'antebraco' ? regiao(e1, h1, F.ante, 1, 0.08, 0.7, CLS_MU[cl], true) : regiao(s1, e1, F.braco, 1, 0.2, 0.9, CLS_MU[cl], true)))));
    if (ex.after) b.push(ex.after(J, R));
    return wrap(b, ex);
  }
  const wrap = (b, ex) => `<svg viewBox="${ex.vb || '0 0 200 190'}" class="fig" role="img" aria-hidden="true">${ex.zoom ? `<g transform="translate(100 ${ex.zy ?? 95}) scale(${ex.zoom}) translate(-100 -${ex.zy ?? 95})">` : '<g>'}${b.join('')}</g></svg>`;

  function draw(P, ex) {
    const J = joints(P);
    if (P.front) return drawFront(P, ex, J);
    const b = [];
    // lado de trás (braço e perna mais distantes), em tom mais escuro
    if (J.elb2) b.push(forma(J.sh, J.elb2, PERFIL['sh-elb'], 'b2f') + forma(J.elb2, J.hand2, PERFIL['elb-hand'], 'b2f') + mao(J.hand2, 'b2f'));
    if (J.knee2) b.push(forma(J.hip, J.knee2, PERFIL['hip-knee'], 'b2f') + forma(J.knee2, J.ank2, PERFIL['knee-ank'], 'b2f') + forma(J.ank2, J.toe2, PERFIL['ank-toe'], 'b2f'));
    if (ex.props) b.push(ex.props(J, R));
    b.push(corpo(J, 'hip', 'knee', 'bf'), corpo(J, 'knee', 'ank', 'bf'), corpo(J, 'ank', 'toe', 'bf'));
    b.push(corpo(J, 'hip', 'sh', 'bf'), corpo(J, 'sh', 'neck', 'bf'), cabeca(J, 'bf'));
    const ARM = ['biceps', 'triceps', 'antebraco', 'ombro'];
    const hl = (keys, cls, arm) => (keys || []).filter(k => ARM.includes(k) === arm).forEach(k => b.push(highlight(J, k, cls)));
    hl(ex.hi2, 'hi2', false); hl(ex.hi, 'hi', false);
    if (ex.mid) b.push(ex.mid(J, R));
    b.push(corpo(J, 'sh', 'elb', 'bf o'), corpo(J, 'elb', 'hand', 'bf o'), mao(J.hand, 'bf'));
    hl(ex.hi2, 'hi2', true); hl(ex.hi, 'hi', true);
    if (ex.after) b.push(ex.after(J, R));
    return wrap(b, ex);
  }
  return { draw, joints, R };
})();

    fim: { anchor: 'knee2', at: [66, 168], torso: -2, uarm: -4, farm: -4, uarm2: 90, farm2: 90, thigh: 178, shin: 178, thigh2: 90, shin2: 180, foot: 90, foot2: 90 },
    props: (J, R) => R.chao(174),
    ev: { nivel: 'moderada', refs: ['McGill SM, 2007, Low Back Disorders — bird dog no "big 3" de estabilização'] } },
];

// ===== Saúde da ficha e do programa semanal =====
// Critérios de prescrição para hipertrofia, com base em:
//  - Schoenfeld, Ogborn & Krieger, 2017, J Sports Sci — relação dose-resposta: ≥10 séries/semana por músculo
//  - Schoenfeld, Ogborn & Krieger, 2016, Sports Med — frequência: 2x/semana ≥ 1x/semana
//  - Schoenfeld et al., 2016, J Strength Cond Res — descanso de 3 min > 1 min em multiarticulares
//  - Schoenfeld et al., 2021, Sports — hipertrofia semelhante entre ~5 e 30 repetições até perto da falha
//  - Simão et al., 2012, Sports Med — a ordem dos exercícios: o que vem primeiro rende mais
const K2G = { peito: 'peito', dorsal: 'costas', ombro: 'ombros', biceps: 'biceps', triceps: 'triceps', quadriceps: 'anterior', posterior: 'posterior', gluteo: 'posterior', abdutor: 'posterior', abdomen: 'core', obliquo: 'core' };
const GRANDES = ['peito', 'costas', 'anterior', 'posterior'];
const META = g => g === 'core' ? [6, 15] : [10, 20];
const nomeG = g => GRUPOS.find(x => x.id === g).nome;
const listaG = gs => { const n = gs.map(nomeG); return n.length > 1 ? n.slice(0, -1).join(', ') + ' e ' + n[n.length - 1] : n[0]; };

// séries que cada exercício conta por grupo: 1 para o grupo principal, 0,5 para os secundários
function contrib(e) {
  if (e.vol === false) return {}; // ex.: panturrilha fica listada em posterior, mas não conta como volume do grupo
  const c = { [e.g]: 1 };
  [...(e.hi || []), ...(e.hi2 || [])].forEach(k => { const g = K2G[k]; if (g && !(g in c)) c[g] = 0.5; });
  return c;
}
function volSessao(f) {
  const v = {};
  f.itens.forEach(i => { const e = EX[i.ex]; if (!e) return; const c = contrib(e); for (const g in c) v[g] = (v[g] || 0) + c[g] * i.series; });
  return v;
}
const duracao = f => Math.round(f.itens.reduce((a, i) => { const e = EX[i.ex]; return e ? a + i.series * ((e.unid === 's' ? i.reps[1] : 40) + i.desc) + 60 : a; }, 0) / 60);
const chk = (nivel, titulo, det) => ({ nivel, titulo, det });
function nota(C) {
  if (!C.length) return null;
  const s = Math.round(100 * C.reduce((a, c) => a + (c.nivel === 'ok' ? 1 : c.nivel === 'warn' ? 0.5 : 0), 0) / C.length);
  return { s, rot: s >= 85 ? 'Excelente' : s >= 70 ? 'Boa' : s >= 50 ? 'Pode melhorar' : 'Precisa de ajustes', cls: s >= 70 ? 'ok' : s >= 50 ? 'warn' : 'bad' };
}

function analisarFicha(f) {
  const its = f.itens.filter(i => EX[i.ex]), n = its.length, C = [];
  if (!n) return { C: [], nota: null };
  // 1. número de exercícios
  C.push(n >= 4 && n <= 8 ? chk('ok', 'Número de exercícios', `${n} exercícios, dentro da faixa de 4 a 8 por sessão.`)
    : n <= 2 || n > 10 ? chk('bad', 'Número de exercícios', n <= 2 ? `Só ${n}. Uma sessão completa costuma ter de 4 a 8 exercícios.` : `${n} exercícios é muito para uma sessão: a qualidade das últimas séries cai. Divida em duas fichas.`)
    : chk('warn', 'Número de exercícios', n === 3 ? '3 exercícios é pouco para uma sessão completa; 4 a 8 é o usual.' : `${n} exercícios deixam a sessão longa; 4 a 8 é o usual.`));
  // 2. duração estimada
  const min = duracao(f);
  C.push(min >= 40 && min <= 75 ? chk('ok', 'Duração estimada', `Cerca de ${min} min, sem contar o aquecimento.`)
    : (min >= 30 && min < 40) || (min > 75 && min <= 90) ? chk('warn', 'Duração estimada', `Cerca de ${min} min. O ideal fica entre 40 e 75 min.`)
    : chk('bad', 'Duração estimada', `Cerca de ${min} min. ${min < 30 ? 'Curta demais para estimular bem os grupos da ficha.' : 'Longa demais: a fadiga compromete o fim do treino.'}`));
  // 3. volume por grupo na sessão
  const v = volSessao(f), exc = Object.keys(v).filter(g => v[g] > 12);
  C.push(exc.length ? chk('warn', 'Volume por grupo na sessão', `${exc.map(g => `${nomeG(g)}: ${fmt(v[g])} séries`).join('; ')}. Acima de ~10 a 12 séries por grupo na mesma sessão, o ganho extra é pequeno; distribua entre dois dias.`)
    : chk('ok', 'Volume por grupo na sessão', 'Nenhum grupo passa de 12 séries na sessão.'));
  // 4. ordem: compostos antes de isolados do mesmo grupo
  const inv = [];
  its.forEach((i, k) => { const e = EX[i.ex]; if (e.tipo !== 'isolado') return; const c = its.findIndex((j, m) => m > k && EX[j.ex].tipo === 'composto' && EX[j.ex].g === e.g); if (c > k) inv.push(`${e.pt} antes de ${EX[its[c].ex].pt}`); });
  C.push(inv.length ? chk('warn', 'Ordem dos exercícios', `${inv.join('; ')}. Faça os compostos primeiro, quando você está mais descansado.`)
    : chk('ok', 'Ordem dos exercícios', 'Compostos vêm antes dos isolados do mesmo grupo.'));
  // 5. descanso dos compostos
  const curto = its.filter(i => EX[i.ex].tipo === 'composto' && i.desc < 90);
  C.push(curto.length ? chk('warn', 'Descanso nos compostos', `${curto.map(i => EX[i.ex].pt).join(', ')} com menos de 1:30. Descanso curto derruba as repetições das séries seguintes; use 2 a 3 min.`)
    : chk('ok', 'Descanso nos compostos', 'Compostos com pelo menos 1:30 de descanso.'));
  // 6. faixa de repetições
  const fora = its.filter(i => !EX[i.ex].unid && (i.reps[0] < 5 || i.reps[1] > 30));
  C.push(fora.length ? chk('warn', 'Faixa de repetições', `${fora.map(i => `${EX[i.ex].pt} (${i.reps[0]}–${i.reps[1]})`).join(', ')}. Para hipertrofia, trabalhe entre 5 e 30 repetições, perto da falha.`)
    : chk('ok', 'Faixa de repetições', 'Todas as faixas entre 5 e 30 repetições.'));
  // 7. grupos grandes com pelo menos um composto
  const semC = GRANDES.filter(g => its.filter(i => EX[i.ex].g === g).reduce((a, i) => a + i.series, 0) >= 3 && !its.some(i => EX[i.ex].g === g && EX[i.ex].tipo === 'composto'));
  if (its.some(i => GRANDES.includes(EX[i.ex].g)))
    C.push(semC.length ? chk('warn', 'Base de compostos', `${listaG(semC)} só com exercícios isolados. Inclua um multiarticular como base.`)
      : chk('ok', 'Base de compostos', 'Os grupos grandes da ficha têm um exercício multiarticular.'));
  return { C, nota: nota(C), min, v };
}

function analisarPrograma(pid) {
  const fs = S.fichas.filter(f => f.prog === pid && (f.vezes ?? 1) > 0 && f.itens.some(i => EX[i.ex]));
  if (!fs.length) return null;
  const vol = {}, freq = {};
  GRUPOS.forEach(g => { vol[g.id] = 0; freq[g.id] = 0; });
  let sess = 0;
  fs.forEach(f => { const x = f.vezes ?? 1, sv = volSessao(f); sess += x; for (const g in sv) { vol[g] += sv[g] * x; if (sv[g] >= 2) freq[g] += x; } });
  const C = [];
  // 1. sessões por semana
  C.push(sess >= 3 && sess <= 6 ? chk('ok', 'Sessões por semana', `${sess} sessões somando ${fs.length} ficha${fs.length > 1 ? 's' : ''} em uso.`)
    : sess < 3 ? chk(sess < 2 ? 'bad' : 'warn', 'Sessões por semana', `${sess} sessão${sess > 1 ? 'ões' : ''}. Com menos de 3 dias fica difícil atingir o volume semanal de todos os grupos.`)
    : chk('warn', 'Sessões por semana', `${sess} sessões. Acima de 6 dias sobra pouco tempo para recuperação.`));
  // 2. cobertura
  const zero = GRUPOS.map(g => g.id).filter(g => vol[g] === 0);
  C.push(zero.length ? chk('bad', 'Todos os grupos treinados', `${listaG(zero)} não aparece${zero.length > 1 ? 'm' : ''} em nenhuma ficha em uso.`)
    : chk('ok', 'Todos os grupos treinados', 'Os 8 grupos aparecem na semana.'));
  // 3. volume semanal
  const baixo = GRUPOS.map(g => g.id).filter(g => vol[g] > 0 && vol[g] < META(g)[0]), alto = GRUPOS.map(g => g.id).filter(g => vol[g] > META(g)[1]);
  const det = [baixo.length ? `Abaixo da meta: ${baixo.map(g => `${nomeG(g)} (${fmt(vol[g])})`).join(', ')}.` : '', alto.length ? `Acima de 20: ${alto.map(g => `${nomeG(g)} (${fmt(vol[g])})`).join(', ')}; mais que isso tende a atrapalhar a recuperação, ainda mais em déficit calórico.` : ''].filter(Boolean).join(' ');
  C.push(!baixo.length && !alto.length ? chk('ok', 'Volume semanal', 'Todos os grupos entre 10 e 20 séries por semana (core: 6 a 15).')
    : chk(baixo.length >= 3 ? 'bad' : 'warn', 'Volume semanal', det + ' Meta: 10 a 20 séries por grupo na semana.'));
  // 4. frequência
  const f1 = GRUPOS.map(g => g.id).filter(g => g !== 'core' && vol[g] > 0 && freq[g] < 2);
  C.push(f1.length ? chk('warn', 'Frequência por grupo', `${listaG(f1)}: 1x por semana. Com o mesmo volume, a frequência pesa pouco, mas treinar cada grupo 2x facilita distribuir as séries com qualidade.`)
    : chk('ok', 'Frequência por grupo', 'Cada grupo é treinado pelo menos 2x por semana.'));
  // 5. equilíbrio empurrar × puxar
  const rp = vol.peito ? vol.costas / vol.peito : 9;
  C.push(rp >= 0.8 ? chk('ok', 'Equilíbrio peito × costas', `Costas ${fmt(vol.costas)} × peito ${fmt(vol.peito)} séries.`)
    : chk('warn', 'Equilíbrio peito × costas', `Costas ${fmt(vol.costas)} × peito ${fmt(vol.peito)} séries. Manter as costas com volume igual ou maior que o peito protege os ombros e a postura.`));
  // 6. equilíbrio anterior × posterior
  const rl = vol.anterior ? vol.posterior / vol.anterior : 9;
  C.push(rl >= 0.7 ? chk('ok', 'Equilíbrio anterior × posterior', `Posterior ${fmt(vol.posterior)} × anterior ${fmt(vol.anterior)} séries.`)
    : chk('warn', 'Equilíbrio anterior × posterior', `Posterior ${fmt(vol.posterior)} × anterior ${fmt(vol.anterior)} séries. Isquiotibiais e glúteos fracos em relação ao quadríceps aumentam o risco de lesão; aproxime os volumes.`));
  return { C, nota: nota(C), vol, freq, sess, n: fs.length };
}

// ---- componentes visuais ----
const ICK = { ok: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', warn: '<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>', bad: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>' };

function checks(C) {

  const prob = C.filter(c => c.nivel !== 'ok').sort((a, b) => (a.nivel === 'bad' ? -1 : 0) - (b.nivel === 'bad' ? -1 : 0)), ok = C.filter(c => c.nivel === 'ok');

}
const selo = nt => nt ? `<span class="selo ${nt.cls}" style="--s:${nt.s}" role="img" aria-label="Nota ${nt.s} de 100, ${nt.rot}"><b class="num" aria-hidden="true">${nt.s}</b><span aria-hidden="true">${nt.rot}</span></span>` : '';
function barras(vol) {

  return `<div class="bars" role="table" aria-label="Séries por semana por grupo">${GRUPOS.map(g => {

    const ic = st === 'ok' ? ICK.ok : st === 'baixo' ? '<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';

      <span class="val ${st}" role="cell"><b class="num">${fmt(x)}</b>${ic}</span></div>`;
  }).join('')}<div class="bar leg" aria-hidden="true"><span></span><span class="trk"><i class="zone" style="left:${pct(10)}%;width:${pct(20) - pct(10)}%"></i><em style="left:${pct(10)}%">10</em><em style="left:${pct(20)}%">20</em><em style="left:100%">30</em></span><span></span></div></div>`;
}
function cardSemana(pid) {
  const P = analisarPrograma(pid);
  if (!P) return '';

    <header><div><span class="eyebrow">Semana deste treino</span><h2>Saúde do treino</h2><span class="meta">${P.sess} sessões · ${P.n} ficha${P.n > 1 ? 's' : ''} em uso</span></div>${selo(P.nota)}</header>

    <div class="aerlinha"><span class="ic" aria-hidden="true">${ICK[semanaAer().eq >= META_AER ? 'ok' : 'warn']}</span><span><b>Aeróbico desta semana: ${semanaAer().eq} de ${META_AER} min.</b> Não entra na nota da musculação; o acompanhamento completo fica na aba Aeróbico.</span></div>
    <details><summary>Como a nota é calculada</summary><p>Cada critério vale 1 ponto (Ok), meio ponto (Atenção) ou zero (Corrigir). Exercício conta 1 série para o grupo principal e 0,5 para os secundários. Fichas com "0x por semana" ficam fora da conta.</p>
    <p>Base: Schoenfeld, Ogborn & Krieger (2017, J Sports Sci) para volume; Schoenfeld, Ogborn & Krieger (2016, Sports Med) para frequência; Schoenfeld et al. (2016, J Strength Cond Res) para descanso; Schoenfeld et al. (2021, Sports) para faixa de repetições; Simão et al. (2012, Sports Med) para ordem dos exercícios.</p></details>

function cardFicha(f) {

  return `<section class="saude">
    <header><div><span class="eyebrow">Saúde da ficha</span><h2>${esc(A.nota.rot)}</h2><span class="meta">~${A.min} min · ${f.itens.reduce((a, i) => a + i.series, 0)} séries · ${f.itens.length} exerc.</span></div>${selo(A.nota)}</header>
    ${checks(A.C)}
  </section>`;
}

// ===== Aeróbico =====
// Meta: ≥150 min/semana de atividade moderada; 1 min vigoroso = 2 min moderados (OMS, 2020). Leve não conta para a meta.
// Intensidade pela FC média (ACSM): 64–76% da FCmáx = moderada; ≥77% = vigorosa; FCmáx estimada = 220 − idade.
const MODS = [['esteira', 'Esteira'], ['corrida', 'Corrida'], ['caminhada', 'Caminhada'], ['bike', 'Bike'], ['eliptico', 'Elíptico'], ['escada', 'Escada'], ['remo', 'Remo'], ['natacao', 'Natação'], ['hiit', 'HIIT'], ['outro', 'Outro']];
const nomeMod = m => (MODS.find(x => x[0] === m) || [0, 'Aeróbico'])[1];
const INTS = { leve: { n: 'Leve', d: 'Conversa normalmente' }, moderada: { n: 'Moderada', d: 'Fala frases curtas' }, vigorosa: { n: 'Vigorosa', d: 'Mal consegue falar' } };
const META_AER = 150;

function inicioSemana(d = new Date()) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function semanaAer(ref = new Date()) {
  const i = inicioSemana(ref), f = new Date(i); f.setDate(f.getDate() + 7);
  const docs = S.aerobicos.filter(a => { const t = new Date(a.data); return t >= i && t < f; });
  const soma = k => docs.filter(a => a.int === k).reduce((s, a) => s + (+a.min || 0), 0);
  const mod = soma('moderada'), vig = soma('vigorosa'), leve = soma('leve');
  return { i, docs, mod, vig, leve, eq: mod + 2 * vig };
}
function intPorFC(fc) {
  const idade = +(S.perfil && S.perfil.idade) || 0;
  if (!fc || !idade) return null;
  const p = fc / (220 - idade);
  return p >= 0.77 ? 'vigorosa' : p >= 0.64 ? 'moderada' : 'leve';
}
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

// ---- barra semanal ----
function barraAer(compacta) {
  const s = semanaAer(), pct = Math.min(100, s.eq / META_AER * 100), ok = s.eq >= META_AER;
  const det = [s.mod ? `${s.mod} moderado` : '', s.vig ? `${s.vig} vigoroso (×2)` : '', s.leve ? `${s.leve} leve (não conta)` : ''].filter(Boolean).join(' · ');
  return `<div class="aerbar ${compacta ? 'compacta' : ''}">
    <div class="aerbar-t"><span><b class="num">${s.eq}</b> de ${META_AER} min</span><span class="${ok ? 'st-ok' : 'st-warn'}">${ok ? `${ICK.ok} Meta da semana batida` : `Faltam ${META_AER - s.eq} min`}</span></div>
    <div class="aertrk" role="img" aria-label="${s.eq} de ${META_AER} minutos nesta semana"><i style="width:${pct}%" class="${ok ? 'ok' : ''}"></i></div>
    ${det ? `<div class="aerbar-d">${det}</div>` : compacta ? '' : '<div class="aerbar-d">Nenhum aeróbico registrado nesta semana.</div>'}
  </div>`;
}
function cardAerHome() {

const IGNORAR = /strength|força|forca|functional|funcional|weight|muscula|core training|flexib|yoga|pilates|cooldown|desaquec|alongamento|mind|mente/i;
function modPorTipo(t) {
  t = (t || '').toLowerCase();
  if (/treadmill|esteira|indoor run|corrida interna/.test(t)) return 'esteira';
  if (/run|corr/.test(t)) return 'corrida';
  if (/walk|camin|hik|trilha/.test(t)) return 'caminhada';
  if (/cycl|bike|cicl|spin|bicic/.test(t)) return 'bike';
  if (/ellip|elípt|elipt|cross ?train/.test(t)) return 'eliptico';
  if (/stair|escad|step/.test(t)) return 'escada';
  if (/row|remo/.test(t)) return 'remo';
  if (/swim|nata/.test(t)) return 'natacao';
  if (/hiit|interval/.test(t)) return 'hiit';
  return 'outro';
}
function dividir(l, sep) {
  if (sep !== ',') return l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
  const out = []; let cur = '', q = false;
  for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; }
  out.push(cur.trim()); return out;
}
function lerData(s) {
  s = (s || '').trim(); if (!s) return null;
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 12), +(m[5] || 0), +(m[6] || 0));
  const iso = s.replace(/^(\d{4}-\d{2}-\d{2})[ ](\d)/, '$1T$2').replace(/\s*([+-]\d{2})(\d{2})$/, '$1:$2');
  const d = new Date(iso); return isNaN(d) ? null : d;
}
const numBR = x => { if (x == null) return null; const s = String(x).replace(/[^\d.,:-]/g, ''); if (!s) return null; const r = parseFloat(s.includes(',') && !s.includes('.') ? s.replace(',', '.') : s.replace(/,/g, '')); return isFinite(r) ? r : null; };

  if (v == null || v === '') return null;
  const m = String(v).match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if (m) return m[3] != null ? +m[1] * 60 + +m[2] + +m[3] / 60 : +m[1] + +m[2] / 60; // h:mm:ss ou mm:ss

}
function analisarImport(txt) {
  const linhas = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const res = { novos: [], dup: 0, ign: 0, err: 0 };
  if (!linhas.length) return res;
  const l0 = linhas[0], sep = ['\t', ';', '|'].find(s => l0.includes(s)) || ',';
  let cols = dividir(l0, sep), idx = null, head = [];
  if (/[a-zA-ZÀ-ú]{3}/.test(cols.join('')) && !lerData(cols[0])) {
    head = cols.map(c => c.toLowerCase());
    const achar = (...rs) => { for (const r of rs) { const i = head.findIndex(h => r.test(h)); if (i >= 0) return i; } return -1; };
    idx = {
      data: achar(/^start|in[ií]cio|^begin/, /date|data/),
      tipo: achar(/workout type|tipo|type/, /workout|atividade|activity|name|nome/),
      dur: achar(/dura/),
      dist: achar(/dist/),
      kcal: achar(/active energy|energia ativa|kcal ativ/, /energy|energia|kcal|calor/),
      fc: achar(/(heart|fc|frequ).*(avg|m[eé]d|average)|(avg|average|m[eé]dia).*(heart|fc)/),
    };
    linhas.shift();
  } else idx = { data: 0, tipo: 1, dur: 2, dist: 3, kcal: 4, fc: 5 };
  const chaves = new Set(S.aerobicos.map(a => a.chave).filter(Boolean));
  linhas.forEach(l => {
    const c = dividir(l, sep), g = i => i >= 0 ? c[i] : null;
    const d = lerData(g(idx.data)), tipo = g(idx.tipo) || '', min = Math.round(lerDuracao(g(idx.dur), head[idx.dur]) || 0);
    if (!d || !min) { res.err++; return; }
    if (IGNORAR.test(tipo)) { res.ign++; return; }
    const mod = modPorTipo(tipo), chave = d.toISOString().slice(0, 16) + '|' + mod;
    if (chaves.has(chave)) { res.dup++; return; }
    chaves.add(chave);
    let dist = numBR(g(idx.dist)); const hd = (head[idx.dist] || '').toLowerCase();
    if (dist != null) { if (/\(m\)|metro|meter/.test(hd) || dist > 200) dist /= 1000; else if (/mi\b|mile/.test(hd)) dist *= 1.609; }
    const fc = numBR(g(idx.fc)), kcal = numBR(g(idx.kcal));
    res.novos.push({ data: d.toISOString(), mod, min, int: intPorFC(fc) || 'moderada', fc: fc || '', dist: dist || '', kcal: kcal || '', origem: 'saude', chave, tipo });
  });

}

const Store = (() => {
  let db = null, base = null;   // base = área privada do usuário: data/users/<id>/app
  const subs = {}, queues = {};
  const col = c => base.collection(c);
  const lread = c => lsGet('db.' + c, {});
  const lemit = c => { const o = lread(c); (subs[c] || []).forEach(fn => fn(Object.entries(o).map(([id, d]) => ({ id, ...d })))); };
  const queue = (key, job) => (queues[key] = (queues[key] || Promise.resolve()).catch(() => {}).then(job));
  return {
    async init() {
      try {
        const has = window.claude && window.claude.use;
        const [d, u] = has ? await Promise.all([window.claude.use('db'), window.claude.use('user')]) : [null, null];
        const uid = u ? await u.id() : null;
        if (d && uid) { db = d; base = d.doc('data/users/' + uid + '/app'); }
      } catch { db = null; base = null; }
      return !!db;
    },
    get nuvem() { return !!db; },
    watch(c, fn) {
      if (db) return col(c).onSnapshot(s => fn(s.docs.map(d => ({ id: d.id, ...clone(d.data()) }))), e => { console.warn(e); toast('Sem conexão com os dados. Recarregue a página.'); });
      (subs[c] = subs[c] || []).push(fn); lemit(c);
    },
    set(c, id, data) {
      return queue(c + '/' + id, async () => {
        if (db) { try { await col(c).doc(id).set(data); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); await col(c).doc(id).set(data); } else throw e; } return; }
        const o = lread(c); o[id] = data; lsSet('db.' + c, o); lemit(c);
      }).catch(e => { console.warn(e); toast(e && e.code === 'quota_exceeded' ? 'Limite de registros atingido. Apague treinos antigos.' : e && e.code === 'invalid_argument' ? 'Sem permissão para salvar. Peça ao dono do app o acesso "Pode interagir".' : 'Não foi possível salvar. Tente de novo.'); throw e; });
    },
    del(c, id) {
      return queue(c + '/' + id, async () => {
        if (db) return col(c).doc(id).delete();
        const o = lread(c); delete o[id]; lsSet('db.' + c, o); lemit(c);
      }).catch(e => { console.warn(e); toast('Não foi possível apagar. Tente de novo.'); });
    },
    id: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  };
})();

// ---------- histórico e progressão ----------
function ultimo(exId) {
  for (const s of S.sessoes) { const it = (s.itens || []).find(i => i.ex === exId); if (it && it.series && it.series.length) return { data: s.data, series: it.series }; }
  return null;
}
function historico(exId, n = 8) {
  const out = [];
  for (const s of S.sessoes) { const it = (s.itens || []).find(i => i.ex === exId); if (it && it.series && it.series.length) { out.push({ data: s.data, ficha: s.fichaNome, series: it.series }); if (out.length >= n) break; } }
  return out;
}
function sugestao(ex, faixa, ult) {
  if (!ult) return null;
  const [lo, hi] = faixa, ser = ult.series;
  const kg = Math.max(0, ...ser.map(s => +s.kg || 0));
  const topo = ser.every(s => (+s.reps || 0) >= hi), abaixo = ser.some(s => (+s.reps || 0) < lo);
  const u = UN(ex);
  const carga = kg > 0 ? `${fmt(kg)} kg` : 'a carga';
  if (topo) {
    if (ex.unid === 's') return { tipo: 'sobe', kg, txt: `Bateu ${hi}s em todas: aumente o tempo` };
    if (ex.inc > 0 && kg > 0) return { tipo: 'sobe', kg: kg + ex.inc, txt: `Suba para ${fmt(kg + ex.inc)} kg (+${fmt(ex.inc)})` };
    return { tipo: 'sobe', kg, txt: 'Bateu o topo da faixa: adicione carga extra' };
  }
  if (abaixo) return { tipo: 'mantem', kg, txt: `Mantenha ${carga} e complete a faixa (${lo}–${hi} ${u})` };
  return { tipo: 'mantem', kg, txt: `Mantenha ${carga} e busque ${hi} ${u}` };
}
const resumoSeries = (ser, unid) => {
  const kgs = [...new Set(ser.map(s => +s.kg || 0))];
  const reps = ser.map(s => s.reps || 0).join(' · ');
  return (kgs.length === 1 ? (kgs[0] ? `${fmt(kgs[0])} kg × ` : '') : '') + reps + (unid === 's' ? ' s' : unid === 'm' ? ' m' : '');
};

function modeloPerfil(dias, nivel) {

  const PPL = [['Treino A · Empurrar', ['peito', 'peito', 'ombro', 'ombro', 'triceps', 'triceps']], ['Treino B · Puxar', ['costas', 'costas', 'costas', 'ombroPost', 'biceps', 'biceps']], ['Treino C · Pernas', ['quad', 'quad', 'post', 'post', 'pant', 'core']]];
  if (dias <= 2) return [['Treino A · Corpo inteiro', 1, FB[0]], ['Treino B · Corpo inteiro', 1, FB[1]]];
